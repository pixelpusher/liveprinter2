name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Set this to your default branch (e.g., main or master)
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Grant GITHUB_TOKEN the permissions required to make a Pages deployment
permissions:
  pages: write      # to deploy to Pages
  id-token: write   # to verify the deployment originates from an appropriate source


# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false
  
jobs:
  # install node and build
  build:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout 🛎️
          uses: actions/checkout@v7.0.1
        
        - name: Setup Pages
          uses: actions/configure-pages@v5
        
        - name: Setup Node.js environment
          uses: actions/setup-node@v6.5.0
          with:
            # Version Spec of the version to use. Examples: 12.x, 10.15.1, >=10.15.0.
            node-version: '24'
        
        - name: Install dependencies 
          run: npm install
  
        - name: Build 🏗️
          # Assuming your package.json has a "build" script that outputs to a "dist" folder.
          # If your build command is different (e.g., "npm run watch"), adjust this line.
          run: npm run build 
        - name: Upload artifact
          uses: actions/upload-pages-artifact@v3
          with:
            # Upload built files
            path: './dist'  
        - name: Deploy to GitHub Pages
          id: deployment
          uses: actions/deploy-pages@v5
